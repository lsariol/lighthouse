name: lighthouse

# Lighthouse deploys itself from release tags, through its update helper.
x-lighthouse:
  deploy: releases
  tier: infra

services:
  lighthouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighthouse
    environment:
      # No secrets here: Lighthouse reads its own from Cove; lighthouse-api's come from the deploy.
      - APP_ENV=prod
      - LIGHTHOUSE_VERSION=${LIGHTHOUSE_DEPLOY_VERSION:-dev}
      - COVE_URL=http://cove:2100
      - COVE_TOKEN_PATH=/app/vault/cove/token
      - STAGING_PATH=/srv/server/staging
      - STORAGE_PATH=/srv/server/storage
      - BACKUP_PATH=/srv/backups
      # The GitHub App that publishes Releases; its key is LIGHTHOUSE_GITHUB_APP_SECRET in Cove.
      - GITHUB_APP_ID=5403106
    # Staging, storage and backups are mounted at the same path as on the host.
    volumes:
      - type: bind
        source: /srv/server/storage/lighthouse/cove
        target: /app/vault/cove
      - type: bind
        source: /srv/server/staging
        target: /srv/server/staging
      - type: bind
        source: /srv/server/storage
        target: /srv/server/storage
        read_only: true
      - type: bind
        source: /srv/backups
        target: /srv/backups
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/lighthouse", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Lets a deploy that already swapped finish its check before Lighthouse stops.
    stop_grace_period: 2m
    networks:
      - spark

  # Read-only answers about projects, deploys and releases for other projects on spark (Vista).
  lighthouse-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighthouse-api
    command: ["/lighthouse", "api"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    expose: ["4000"]
    environment:
      - APP_ENV=prod
      - LIGHTHOUSE_VERSION=${LIGHTHOUSE_DEPLOY_VERSION:-dev}
      - LIGHTHOUSE_DATABASE_READER_URL=${LIGHTHOUSE_DATABASE_READER_URL}
      - SHARED_LIGHTHOUSE_VISTA_TOKEN=${SHARED_LIGHTHOUSE_VISTA_TOKEN}
    healthcheck:
      test: ["CMD", "/lighthouse", "health", "api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - spark

networks:
  spark:
    external: true
